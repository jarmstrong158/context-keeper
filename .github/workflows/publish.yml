name: Publish to PyPI + MCP Registry

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # PyPI Trusted Publishing + MCP Registry, both via OIDC
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1

      # --- MCP registry (server.json) ---
      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      # Only a tag push carries a version in GITHUB_REF. This workflow also runs
      # on `release` and `workflow_dispatch`, where GITHUB_REF is refs/heads/main
      # -- the old unconditional strip left that string intact and published
      # `"version": "refs/heads/main"`, which the registry rejected with a 400.
      # Outside a tag push, server.json is already authoritative:
      # TestVersionConsistency asserts all five version literals agree.
      - name: Sync server.json version to the release tag
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            jq --arg v "$VERSION" '.version = $v | .packages[0].version = $v' server.json > server.tmp && mv server.tmp server.json
            echo "Synced server.json to tag version $VERSION"
          else
            echo "Not a tag push; using server.json as committed ($(jq -r .version server.json))"
          fi

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
