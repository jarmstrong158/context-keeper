name: Build MCPB bundle

# Builds the Claude Desktop .mcpb bundle and, on a version tag, attaches it to
# that tag's GitHub Release so distribution is "download the .mcpb from Releases".
# On manual dispatch it just uploads the bundle as a workflow artifact for testing.

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build .mcpb bundle
        run: bash scripts/build-mcpb.sh

      - name: Validate manifest
        run: npx --yes @anthropic-ai/mcpb@2 validate mcpb/manifest.json

      - name: Upload bundle as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: context-keeper-mcpb
          path: dist/*.mcpb

      - name: Attach bundle to the tag's Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.mcpb
